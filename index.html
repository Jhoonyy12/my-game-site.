<!DOCTYPE html>
<html>
<head>
<title>Team Scorpio</title>

<style>
body{
    margin:0;
    background:#121027;
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
}

.title{
    font-size:80px;
    font-weight:900;
    letter-spacing:6px;
    margin-top:40px;
    text-transform:uppercase;
    text-shadow:
        0 0 10px #ff3355,
        0 0 20px #ff3355,
        0 0 40px #ff3355;
}

.subtitle{
    font-size:20px;
    letter-spacing:8px;
    color:#8ea2ff;
    margin-bottom:50px;
}

.games{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
}

.game{
    text-align:center;
}

.tile{
    width:300px;
    height:300px;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,0.6);
    transition:0.3s;
}

.tile:hover{
    transform:scale(1.05);
}

.tile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.game-name{
    margin-top:15px;
    font-size:28px;
    font-weight:bold;
    color:white;
}

a{
    text-decoration:none;
}
</style>

</head>
<body>

<div class="title">TEAM SCORPIO</div>
<div class="subtitle">GAME PORTAL</div>

<div class="games">

    <div class="game">
        <a href="https://apexdrawn.com/" target="_blank">
            <div class="tile">
                <img src="teamscorpio.png" alt="ApexDrawn">
            </div>
        </a>
        <div class="game-name">ApexDrawn</div>
    </div>

    <div class="game">
        <a href="https://subwaysurfers.gg/" target="_blank">
            <div class="tile">
                <img src="teamscorpio.png" alt="Subway Surfers">
            </div>
        </a>
        <div class="game-name">Subway Surfers</div>
    </div>

</div>

</body>
</html>
