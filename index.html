<!DOCTYPE html>
<html>
<head>
<title>Team Scorpio</title>

<style>
body{
    margin:0;
    background:#121027;
    font-family:Arial,sans-serif;
    text-align:center;
    color:white;
}

.title{
    font-size:80px;
    font-weight:900;
    letter-spacing:6px;
    margin-top:40px;
    margin-bottom:0;
    text-transform:uppercase;
    text-shadow:
        0 0 10px #ff3355,
        0 0 20px #ff3355,
        0 0 40px #ff3355;
}

.subtitle{
    font-size:20px;
    letter-spacing:10px;
    color:#8ea2ff;
    margin-top:10px;
    margin-bottom:50px;
}

.tile{
    width:350px;
    height:350px;
    margin:auto;
    border-radius:25px;
    overflow:hidden;
    background:black;
    box-shadow:0 8px 25px rgba(0,0,0,0.6);
    transition:0.3s;
}

.tile:hover{
    transform:scale(1.05);
}

.logo{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:220px;
    font-weight:900;
    color:white;
    font-family:Arial Black,sans-serif;
}

.game-name{
    margin-top:20px;
    font-size:36px;
    font-weight:bold;
    color:white;
}

a{
    text-decoration:none;
}
</style>

</head>
<body>

<div class="title">TEAM SCORPIO</div>
<div class="subtitle">GAME PORTAL</div>

<a href="https://apexdrawn.com/" target="_blank">
    <div class="tile">
        <div class="logo">A</div>
    </div>
</a>

<div class="game-name">ApexDrawn</div>

</body>
</html>
