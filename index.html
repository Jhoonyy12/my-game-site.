<!DOCTYPE html>
<html>
<head>
<title>Jhoony's Games</title>

<style>
body {
    background: #a8fff7;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 60px;
}

.tile {
    width: 300px;
    height: 300px;
    margin: 50px auto;
    background: white;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.game-name {
    font-size: 32px;
    font-weight: bold;
    margin-top: 15px;
}
</style>

</head>
<body>

<h1>🎮 Jhoony's Gaming Website 🎮</h1>

<a href="https://apexdrawn.com/" target="_blank">
    <div class="tile">
        <img src="apexdrawn.png" alt="ApexDrawn">
    </div>
</a>

<div class="game-name">ApexDrawn</div>

</body>
</html>
