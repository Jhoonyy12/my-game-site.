<!DOCTYPE html>
<html>
<head>
    <title>Jhoony's Gaming Website</title>
</head>
<body>
    <h1>🎮 Jhoony's Gaming Website 🎮</h1>
    <p>Welcome to my website!</p>

    <button onclick="playGame()">Click Me!</button>

    <p id="score">Score: 0</p>

    <script>
    let score = 0;

    function playGame() {
        score++;
        document.getElementById("score").textContent =
            "Score: " + score;
    }
    </script>
</body>
</html>
